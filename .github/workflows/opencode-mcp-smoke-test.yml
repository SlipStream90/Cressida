name: opencode MCP smoke test

on:
  workflow_dispatch:
  push:
    branches: [MI6]
  pull_request:

jobs:
  mcp-connectivity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install opencode CLI
        run: |
          curl -fsSL https://opencode.ai/install | bash
          BIN=$(command -v opencode || find "$HOME" -maxdepth 4 -name opencode -type f 2>/dev/null | head -1)
          [ -n "$BIN" ] || { echo "opencode binary not found after install"; exit 1; }
          echo "$(dirname "$BIN")" >> "$GITHUB_PATH"

      - name: Verify opencode installed
        run: opencode --version

      # This is the exact README one-liner (`curl ... install.sh | bash`), just
      # sourced from this checkout instead of raw.githubusercontent.com so the
      # test always exercises the commit under test, not a possibly-stale or
      # not-yet-pushed copy. CRESSIDA_REPO=local path makes install.sh `git
      # clone` this checkout's current commit — same clone -> isolated venv ->
      # pip install -e -> `onboard.py --skip-install --register` sequence a
      # real user's machine runs.
      - name: Run the documented installer against this commit
        run: |
          export CRESSIDA_REPO="$GITHUB_WORKSPACE"
          bash install.sh

      - name: Check MCP connection
        run: |
          opencode mcp list | tee mcp-list.txt
          grep -q "cressida" mcp-list.txt || { echo "cressida MCP server not registered"; exit 1; }
          opencode mcp debug cressida
