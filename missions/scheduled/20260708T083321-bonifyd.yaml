schedule: "2026-07-08T14:20:00"
brief: |
  Build Bonifyd — a two-sided B2B marketplace / lead-intelligence platform for Indian industrial SMEs. This release ships only the core value loop across 8 surfaces: Supabase Auth, an Onboarding wizard, and a Dashboard; seller-side Lead Grid with credit-gated server-side contact unlocks plus an RFQ Inbox & Quotations; buyer-side RFQ Dashboard to post RFQs and review quotations; and a cross-cutting Star/Favourite bookmark layer over leads and RFQs. A company is seller, buyer, or both; a "both" company shares one team and one credit wallet and gets a dashboard switcher. Role (admin/member) is per-user-per-company. Credits are the only metered resource and are spent only on Lead Grid contact unlocks; RFQ posting and quotation submission are free/unlimited during alpha. New companies get a 100-credit starter grant via a handle_new_company DB trigger. PII reveal is server-side and credit-gated via an unlock-contact edge function that atomically checks wallet balance, deducts credits, logs to contact_unlocks + credit_transactions, and returns the full contact; never reveal PII from a client-side query; PII columns encrypted at rest. Lead Grid shows company/designation/industry/cluster to everyone (name/phone/email blurred until unlocked). Security enforced by RLS on every table via public.is_company_member(company_id); favourites are per-user (user_id = auth.uid()) with no edge function — plain insert/delete under RLS, optimistic UI, polymorphic item_id referencing contacts.id or rfqs.id with no cross-table FK. Auth uses Supabase built-in flows only (email verification, password reset, magic links); a handle_new_user trigger auto-creates the public.users row. Stack: Next.js on Vercel, Supabase (Postgres + Auth + Storage + Edge Functions in TypeScript), Supabase JS v2, shadcn UI. Edge functions: unlock-contact, create-rfq, submit-quotation, accept-invitation, plus a CRON grant-monthly-credit-topup. Core tables: users, companies, user_companies, contacts, contact_unlocks, credit_wallets, credit_transactions, rfqs, quotations, favourites. Seed 3 industries, 5 clusters, 20 sample contacts, 10 sample RFQs. Design: deep teal #0F4C4C, amber #F59E0B CTAs, off-white #F8FAFC background, Inter typeface, responsive down to 375px.
