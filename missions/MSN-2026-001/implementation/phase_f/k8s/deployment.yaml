apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-svc
  labels:
    app: echo
    service: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo
      service: api
  template:
    metadata:
      labels:
        app: echo
        service: api
    spec:
      containers:
      - name: api
        image: echo-api:latest
        ports:
        - containerPort: 8000
        env:
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: echo-secrets
              key: gemini-api-key
        - name: ELEVENLABS_API_KEY
          valueFrom:
            secretKeyRef:
              name: echo-secrets
              key: elevenlabs-api-key
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: echo-secrets
              key: supabase-url
        - name: SUPABASE_ANON_KEY
          valueFrom:
            secretKeyRef:
              name: echo-secrets
              key: supabase-key
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: echo-secrets
              key: redis-url
        - name: DEBUG
          value: "false"
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  labels:
    app: echo
    service: api
spec:
  selector:
    app: echo
    service: api
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
