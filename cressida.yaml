# CRESSIDA Configuration
version: "0.1.0"

system:
  name: "CRESSIDA"
  description: "Autonomous Multi-Agent Software Engineering Intelligence Framework"
  max_concurrent_tasks: 4
  task_timeout_seconds: 3600
  max_retries: 3
  retry_delay_seconds: 5

memory:
  base_path: "memory"
  strategic:
    architecture_file: "architecture.json"
    decisions_file: "decisions.json"
    patterns_file: "learned_patterns.json"

evaluation:
  base_path: "evaluations"
  default_weights:
    architecture_compliance: 0.3
    code_quality: 0.2
    test_coverage: 0.2
    performance: 0.15
    security: 0.15

logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"

agents:
  auto_register: true
  agent_path: "agents/"
  # Provider selection — first available wins when set to "auto"
  # Options: auto | anthropic | openai | gemini | groq | ollama
  # Override with env var: CRESSIDA_PROVIDER=gemini
  provider: "auto"

  model_overrides:
    # NOTE: like the obsidian: block below, this file is documentation only —
    # nothing parses cressida.yaml's model_overrides.anthropic. The real, live
    # source of truth for both Anthropic-backed providers (native "anthropic"
    # and the "claude_cli" subprocess path, the one actually used when no API
    # key is set) is core/model_tiers.py's ROLE_MODEL. Edit that file, not this
    # block, to change model assignments — keep this in sync if you do.
    #
    # Tiering: planners/deciders (M, R, INTELLIGENCE, LEITER, Q, BOND, TANNER)
    # run on haiku/sonnet — fast, since their output is gated or checked
    # downstream rather than shipping as-is. Executors (BRANCH, ROOK,
    # BOOTHROYD, MONEYPENNY, REVIEW) run on opus, since their output ships as
    # the mission's actual deliverable and a defect there is expensive to
    # catch after the fact.
    anthropic:
      M:            "claude-haiku-4-5-20251001"
      R:            "claude-haiku-4-5-20251001"
      INTELLIGENCE: "claude-sonnet-5"
      LEITER:       "claude-sonnet-5"
      Q:            "claude-sonnet-5"
      BOND:         "claude-sonnet-5"
      TANNER:       "claude-sonnet-5"
      BRANCH:       "claude-opus-5"
      ROOK:         "claude-opus-5"
      BOOTHROYD:    "claude-opus-5"
      MONEYPENNY:   "claude-opus-5"
      REVIEW:       "claude-opus-5"
      default:      "claude-sonnet-5"
    openai:
      BOND:         "gpt-4o"
      INTELLIGENCE: "gpt-4o"
      LEITER:       "gpt-4o"
      Q:            "gpt-4o"
      default:      "gpt-4o-mini"
    gemini:
      BOND:         "gemini-1.5-pro"
      INTELLIGENCE: "gemini-1.5-pro"
      LEITER:       "gemini-1.5-pro"
      Q:            "gemini-1.5-pro"
      default:      "gemini-1.5-flash"
    groq:
      BOND:         "llama-3.3-70b-versatile"
      INTELLIGENCE: "llama-3.3-70b-versatile"
      LEITER:       "llama-3.3-70b-versatile"
      Q:            "llama-3.3-70b-versatile"
      default:      "llama-3.1-8b-instant"
    ollama:
      default:      "llama3.2"   # change to any tool-capable model you have pulled
      host:         "http://localhost:11434"

obsidian:
  # NOTE: this file is documentation only — nothing in cressida/ actually parses
  # cressida.yaml's obsidian: block. The real, live config is the two env vars
  # below (read by cressida.obsidian.bridge.get_bridge()). Keep them in sync
  # with what you write here.
  #
  # vault_path must be the folder that actually contains .obsidian/ — not a
  # parent of it. Pointing one level too shallow silently creates a sibling
  # folder Obsidian never displays, which is exactly what happened here before
  # this was corrected.
  #   CRESSIDA_OBSIDIAN_VAULT=C:/Users/adity/Desktop/THEIA/THEIA
  #   CRESSIDA_OBSIDIAN_FOLDER=            (empty — write flat at vault root,
  #                                          matching this vault's existing
  #                                          Agents/Missions/Knowledge/System
  #                                          layout instead of nesting a
  #                                          "Cressida" subfolder inside it)
  vault_path: "C:/Users/adity/Desktop/THEIA/THEIA"
  cressida_folder: ""              # "" = flat at vault root; see CRESSIDA_OBSIDIAN_FOLDER above
  inbox_folder: "Inbox"            # drop .md briefs here to trigger missions
  poll_interval_seconds: 15        # how often to check the inbox folder

autonomy:
  # Layer 4 — Self-Triggering
  watcher:
    inbox_dir: "missions/inbox"
    scheduled_dir: "missions/scheduled"
    poll_interval_seconds: 10

  # Layer 5 — Self-Monitoring
  monitor:
    stall_threshold_seconds: 1800
    check_interval_seconds: 60
    status_port: 7437
    status_file: "missions/status.json"

  # Layer 5 — Post-Mortem
  postmortem:
    lessons_file: "knowledge/lessons.md"
    postmortems_dir: "memory/postmortems"
    run_remediation_analysis: true

  # Layer 3 — BOND autonomous gates
  bond:
    confidence_threshold: 0.7
    escalation_dir: "missions/{mission_id}/escalations"
